name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned with checksums from the release's .sha256sum files. Bump all
      # three together.
      KIND_VERSION: v0.33.0
      KIND_SHA256_AMD64: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KIND_SHA256_ARM64: 20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          arch="$(go env GOARCH)"
          case "$arch" in
            amd64) sum="$KIND_SHA256_AMD64" ;;
            arm64) sum="$KIND_SHA256_ARM64" ;;
            *) echo "no pinned kind checksum for $arch" >&2; exit 1 ;;
          esac
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${arch}"
          echo "${sum}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # Runs against the committed go.mod/go.sum; ci.yml's verify-generated
      # job reports drift instead of go mod tidy rewriting it here.
      - name: Running Test e2e
        run: make test-e2e
