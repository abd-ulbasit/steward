# Steward configuration sketch -- NOT READ BY ANY CODE
#
# Nothing in this repository loads this file. It is a design sketch from the
# initial project setup and describes components that do not exist (a
# Terraform-backed AWS provider, a platform API, Grafana dashboards, a service
# catalog). The operator is configured only by:
#   - command-line flags (cmd/main.go; see config/manager/manager.yaml), and
#   - environment variables read by internal/provider/factory.go, chiefly
#     STEWARD_PROVIDER ("kubernetes", or "mock" for local development; aws
#     and gcp are recognised but not implemented).
#
# If the Terraform section is ever implemented, three points from the 2026-10
# security review apply:
#   - workDir /tmp/steward-terraform cannot be written: the manager runs with
#     readOnlyRootFilesystem and no volumes. Mount an emptyDir.
#   - S3 state locking no longer needs DynamoDB: Terraform 1.11+ supports
#     use_lockfile = true on the S3 backend, and DynamoDB locking is deprecated.
#   - generated database passwords would land in Terraform state; prefer
#     provider-managed master passwords and treat the state bucket as a secret
#     store (encryption, versioning, tight IAM), not only encrypt: true.

# Controller settings
controller:
  # Metrics server bind address
  metricsBindAddress: ":8080"
  
  # Health probe bind address
  healthProbeBindAddress: ":8081"
  
  # Leader election for high availability
  leaderElection:
    enabled: true
    resourceName: steward-leader-election
    resourceNamespace: steward-system
  
  # Worker counts per controller
  workers:
    application: 5
    database: 3
    cache: 3

# Terraform settings
terraform:
  # Path to terraform binary
  binaryPath: "/usr/local/bin/terraform"
  
  # Working directory for terraform operations
  workDir: "/tmp/steward-terraform"
  
  # State backend configuration
  stateBackend:
    type: s3  # s3 or local
    bucket: "steward-terraform-state"
    region: "us-east-1"
    dynamoDBTable: "steward-terraform-locks"
    encrypt: true
  
  # Execution settings
  parallelism: 10
  timeout: 30m

# AWS settings
aws:
  region: "us-east-1"
  
  # VPC for provisioned resources
  vpcId: "vpc-xxxxxxxx"
  subnetIds:
    - "subnet-xxxxxxxx"
    - "subnet-yyyyyyyy"
  
  # Tags applied to all resources
  defaultTags:
    Environment: "production"
    ManagedBy: "steward"

# Platform API settings
api:
  enabled: true
  bindAddress: ":8082"
  
  # Authentication
  auth:
    type: "jwt"  # jwt or apikey
    jwtIssuer: "https://auth.example.com"
    jwtAudience: "steward"

# Observability settings
observability:
  # Prometheus ServiceMonitor generation
  prometheus:
    enabled: true
    namespace: "monitoring"
  
  # Grafana dashboard generation
  grafana:
    enabled: true
    namespace: "monitoring"
  
  # OpenTelemetry tracing
  tracing:
    enabled: true
    endpoint: "http://otel-collector:4317"
    sampleRate: 0.1

# Service catalog settings
catalog:
  enabled: true
  
  # Automatic dependency detection
  dependencyDetection:
    enabled: true
  
  # Compliance checking
  compliance:
    enabled: true
    policies:
      - "resource-limits-required"
      - "security-context-required"

# Logging
logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json or text
  development: false

# Default values for Applications
defaults:
  application:
    replicas: 2
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  
  database:
    postgres:
      small:
        instanceClass: "db.t3.micro"
        storage: 20
      medium:
        instanceClass: "db.t3.small"
        storage: 50
      large:
        instanceClass: "db.t3.medium"
        storage: 100
  
  cache:
    redis:
      small:
        nodeType: "cache.t3.micro"
        numNodes: 1
      medium:
        nodeType: "cache.t3.small"
        numNodes: 2
      large:
        nodeType: "cache.t3.medium"
        numNodes: 3
