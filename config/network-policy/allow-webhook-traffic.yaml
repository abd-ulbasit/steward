# This NetworkPolicy allows the Kubernetes API server to reach the admission
# webhook server running in the controller-manager pod.
#
# Port: NetworkPolicy matches the port on the pod, after the Service has
# translated it. The webhook Service listens on 443 but targets the container
# port 9443 (config/webhook/service.yaml, config/default/manager_webhook_patch.yaml),
# so 9443 is the port to allow. Allowing 443 matched nothing.
#
# Source: admission requests come from the API server, which on most clusters
# runs on the control-plane hosts (or outside the cluster on managed services),
# not in a Pod in a labelled namespace, so a namespaceSelector cannot match it.
# The rule therefore admits any source, but only on the webhook port. Every
# other port on the manager stays closed by this policy and allow-metrics-traffic.
# If the API server's source addresses are known and stable, replace `from` with
# an ipBlock for them.
#
# The webhooks use failurePolicy: Fail, so a policy that blocks this traffic
# blocks every create and update of an Application.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: steward
    app.kubernetes.io/managed-by: kustomize
  name: allow-webhook-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: steward
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
